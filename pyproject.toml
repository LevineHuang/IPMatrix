[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ipmatrix"
version = "0.1.0"
description = "Local-first paper content pipeline for IPMatrix."
requires-python = ">=3.9"

[project.scripts]
pipeline = "ipmatrix.pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
